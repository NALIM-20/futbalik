<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ liga }} - Tabuľka</title>
    <style>
        :root {
            --bg-color: #0b130e;
            --card-bg: #142219;
            --accent-color: #22c55e;
            --text-main: #f0fdf4;
            --text-muted: #86efac;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
        }

        .navbar {
            background-color: #091a10;
            border-bottom: 2px solid var(--accent-color);
            padding: 15px 20px;
        }

        .navbar-container {
            max-width: 1000px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.4rem;
            font-weight: bold;
            color: var(--accent-color);
            text-decoration: none;
        }

        .back-btn {
            color: var(--text-main);
            text-decoration: none;
            padding: 6px 12px;
            border-radius: 6px;
            background-color: #11261a;
            border: 1px solid #1b3d29;
            font-weight: 600;
        }

        .back-btn:hover {
            background-color: var(--accent-color);
            color: var(--bg-color);
        }

        .container {
            max-width: 900px;
            margin: 30px auto;
            padding: 0 20px;
        }

        h2 {
            color: var(--accent-color);
            text-align: center;
            margin-bottom: 25px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .table-container {
            background-color: var(--card-bg);
            border: 1px solid #1b3d29;
            border-radius: 12px;
            overflow-x: auto;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            min-width: 600px;
        }

        th, td {
            padding: 12px 15px;
            border-bottom: 1px solid #1b3d29;
        }

        th {
            background-color: #09140f;
            color: var(--accent-color);
            font-weight: bold;
        }

        tr:hover {
            background-color: #1c3326;
        }

        .team-link {
            color: var(--text-main);
            text-decoration: none;
            font-weight: 600;
        }

        .team-link:hover {
            color: var(--accent-color);
            text-decoration: underline;
        }

        .crest-img {
            height: 20px;
            vertical-align: middle;
            margin-right: 8px;
        }
    </style>
</head>
<body>

<nav class="navbar">
    <div class="navbar-container">
        <a href="/" class="logo">Futbalík Live</a>
        <a href="/" class="back-btn">Domov</a>
    </div>
</nav>

<div class="container">
    <h2>{{ liga }}</h2>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>#</th>
                    <th>Tím</th>
                    <th>Z</th>
                    <th>V</th>
                    <th>R</th>
                    <th>P</th>
                    <th>Skóre</th>
                    <th>Body</th>
                </tr>
            </thead>
            <tbody>
                {% for r in tabulka %}
                <tr>
                    <td><strong>{{ r.position }}</strong></td>
                    <td>
                        {% if r.team.crest %}
                            <img src="{{ r.team.crest }}" class="crest-img" alt="">
                        {% endif %}
                        <a href="/tabulka/tim/{{ r.team.id }}" class="team-link">{{ r.team.name }}</a>
                    </td>
                    <td>{{ r.playedGames }}</td>
                    <td>{{ r.won }}</td>
                    <td>{{ r.draw }}</td>
                    <td>{{ r.lost }}</td>
                    <td>{{ r.goalsFor }}:{{ r.goalsAgainst }}</td>
                    <td><strong style="color: var(--accent-color);">{{ r.points }}</strong></td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>

</body>
</html>
